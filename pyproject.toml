[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-media-converter"
version = "0.1.0"
description = "Minimal desktop converter for documents, images and videos."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.6",
    "Pillow>=11.3",
    "pillow-heif>=0.18",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "pyinstaller>=6.6"]

[project.gui-scripts]
umc = "umc.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
umc = ["gui/*.qss"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
