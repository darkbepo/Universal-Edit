[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-edit"
version = "0.1.0"
description = "Universal Edit: convert and edit documents, images, video, audio, 3D models and more."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.6",
    "PySide6-Addons>=6.6",  # Qt Multimedia (LGPL): video / music playback in the viewer
    "Pillow>=11.3",
    "numpy>=1.26",
    "pillow-heif>=0.18",
    "PyMuPDF>=1.24",
    "rawpy>=0.20",
    "openpyxl>=3.1",
    "mammoth>=1.8",
    "markdown-it-py>=4.0",
    "PyYAML>=6.0",
    "trimesh>=4.0",
    "cascadio>=0.1",
    "lxml>=5.0",
    "networkx>=3.0",
    "py7zr>=1.0",
    "pyzipper>=0.3.6",
    "fonttools[woff]>=4.50",
    "vtracer>=0.6",
    "pdf2docx>=0.5.8",
    "python-docx>=1.1",
    "ezdxf>=1.3",
    "opencv-python-headless>=4.8",  # content-aware fill (cv2.inpaint); also needed by pdf2docx
    "onnxruntime>=1.17",  # background removal (the model is downloaded on first use)
    "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "pyinstaller>=6.6"]

[project.gui-scripts]
umc = "umc.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
umc = ["gui/*.qss", "gui/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
