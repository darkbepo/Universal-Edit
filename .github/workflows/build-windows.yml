name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The prebuilt PyInstaller launcher is shared with a lot of malware, so antivirus
      # machine-learning scanners (e.g. Defender's "Bearfoos.B!ml") flag apps that use it.
      # Compiling our own launcher from source avoids that false positive.
      - name: Rebuild PyInstaller with a locally compiled bootloader
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          $v = python -c "import importlib.metadata as m; print(m.version('pyinstaller'))"
          pip uninstall -y pyinstaller
          pip install --no-cache-dir --no-binary pyinstaller "pyinstaller==$v"
          python -c "import PyInstaller, pathlib; p = pathlib.Path(PyInstaller.__file__).parent / 'bootloader' / 'Windows-64bit-intel' / 'runw.exe'; print(p, p.stat().st_size)"

      - name: Fetch FFmpeg (GPL build with x264/x265)
        run: |
          python scripts/fetch_ffmpeg.py
          "$PWD\packaging\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Fetch OCR language data (English, bundled)
        run: python scripts/fetch_tessdata.py

      - name: Fetch subtitle font (DejaVu Sans, bundled)
        run: python scripts/fetch_font.py

      - name: Run tests
        run: pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm packaging/umc.spec

      - name: Self-test the built executable
        run: |
          $p = Start-Process -FilePath "dist\UniversalEdit\UniversalEdit.exe" `
                -ArgumentList "--self-test", "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          $info = (Get-Item "dist\UniversalEdit\UniversalEdit.exe").VersionInfo
          $info | Format-List ProductName, FileDescription, FileVersion, LegalCopyright
          if ($info.ProductName -ne "Universal Edit") { throw "version info missing" }

      - name: Zip
        run: Compress-Archive -Path dist/UniversalEdit -DestinationPath UniversalEdit-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: UniversalEdit-windows
          path: UniversalEdit-windows.zip
