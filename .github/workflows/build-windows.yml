name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch FFmpeg (GPL build with x264/x265)
        run: |
          python scripts/fetch_ffmpeg.py
          "$PWD\packaging\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Run tests
        run: pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm packaging/umc.spec

      - name: Self-test the built executable
        run: |
          $p = Start-Process -FilePath "dist\UniversalMediaConverter\UniversalMediaConverter.exe" `
                -ArgumentList "--self-test", "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Zip
        run: Compress-Archive -Path dist/UniversalMediaConverter -DestinationPath UniversalMediaConverter-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: UniversalMediaConverter-windows
          path: UniversalMediaConverter-windows.zip
