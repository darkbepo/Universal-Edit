name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The prebuilt PyInstaller launcher is shared with a lot of malware, so antivirus
      # machine-learning scanners (e.g. Defender's "Bearfoos.B!ml") flag apps that use it.
      # Compiling our own launcher from source avoids that false positive.
      - name: Rebuild PyInstaller with a locally compiled bootloader
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          $v = python -c "import importlib.metadata as m; print(m.version('pyinstaller'))"
          pip uninstall -y pyinstaller
          pip install --no-cache-dir --no-binary pyinstaller "pyinstaller==$v"
          python -c "import PyInstaller, pathlib; p = pathlib.Path(PyInstaller.__file__).parent / 'bootloader' / 'Windows-64bit-intel' / 'runw.exe'; print(p, p.stat().st_size)"

      - name: Fetch FFmpeg (GPL build with x264/x265)
        run: |
          python scripts/fetch_ffmpeg.py
          "$PWD\packaging\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Fetch OCR language data (English, bundled)
        run: python scripts/fetch_tessdata.py

      - name: Fetch subtitle font (DejaVu Sans, bundled)
        run: python scripts/fetch_font.py

      - name: Run tests
        run: pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm packaging/umc.spec

      - name: Self-test the built executable
        run: |
          $p = Start-Process -FilePath "dist\UniversalEdit\UniversalEdit.exe" `
                -ArgumentList "--self-test", "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          $info = (Get-Item "dist\UniversalEdit\UniversalEdit.exe").VersionInfo
          $info | Format-List ProductName, FileDescription, FileVersion, LegalCopyright
          if ($info.ProductName -ne "Universal Edit") { throw "version info missing" }

      - name: Zip
        run: Compress-Archive -Path dist/UniversalEdit -DestinationPath UniversalEdit-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: UniversalEdit-windows
          path: UniversalEdit-windows.zip

      # The installer (packaging/installer.iss): per user, no admin; optional right-click
      # "Convert" and "Open with", written by the app itself (--register / --unregister).
      - name: Build installer
        run: |
          $v = python -c "import umc; print(umc.__version__)"
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$v" "/DSourceDir=$PWD\dist\UniversalEdit" "/DOutputDir=$PWD\installer" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test the installer (silent install, check Windows integration, uninstall)
        run: |
          $p = Start-Process installer\UniversalEdit-setup.exe -Wait -PassThru -ArgumentList `
                '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS="contextmenu,openwith"', "/LOG=$PWD\install.log"
          if ($p.ExitCode -ne 0) { Get-Content install.log; exit 1 }
          $dir = "$env:LOCALAPPDATA\Programs\Universal Edit"
          if (-not (Test-Path "$dir\UniversalEdit.exe")) { throw "not installed in $dir" }
          $menu = 'HKCU:\Software\Classes\SystemFileAssociations\.png\shell\UniversalEdit.Convert\command'
          $cmd = (Get-ItemProperty $menu).'(default)'
          "right-click command: $cmd"
          if ($cmd -notlike '*UniversalEdit.exe*--convert*') { throw "right-click Convert missing" }
          $caps = (Get-ItemProperty 'HKCU:\Software\RegisteredApplications').'Universal Edit'
          if ($caps -ne 'Software\UniversalEdit.Integration\Capabilities') { throw "Open with missing" }
          $view = (Get-ItemProperty 'HKCU:\Software\Classes\UniversalEdit.View\shell\open\command').'(default)'
          if ($view -notlike '*UniversalEdit.exe*--view*') { throw "viewer command missing" }
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\UniversalEdit.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\UniversalEdit.exe") { throw "files left after uninstalling" }
          if (Test-Path ($menu -replace '\\command$', '')) { throw "right-click Convert left after uninstalling" }
          if ((Get-ItemProperty 'HKCU:\Software\RegisteredApplications').'Universal Edit') { throw "Open with left" }

      - uses: actions/upload-artifact@v4
        with:
          name: UniversalEdit-setup
          path: installer/UniversalEdit-setup.exe
