name: Web companion

on:
  workflow_dispatch:
  push:
    paths: ["web/**", ".github/workflows/web.yml"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

      - name: Install ffmpeg (creates the sample video for the browser tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Browser tests (real conversions in headless Chromium)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/upload-artifact@v4
        with:
          name: web-companion-site
          path: web/dist
