name: Build Linux package

# The Debian / Ubuntu .deb (scripts/build_deb.py), made from the same code and the same v* tag
# as the Windows build: a version tag publishes it in the same GitHub release.
# Built on Debian 12 — the oldest supported system (glibc 2.36, FFmpeg 5.1; Ubuntu 22.04's
# FFmpeg 4.4 lacks options the app uses) — so it runs on Debian 12+ and Ubuntu 24.04+, then
# installed and self-tested on clean containers of each.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  QT_QPA_PLATFORM: offscreen

permissions:
  contents: read  # only the publish job writes (the release and the apt repository)

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm  # Debian 12 with Python 3.12 (shared libpython for PyInstaller)
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'src'); import umc; print(umc.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but src/umc/__init__.py says v$v"; exit 1; }

      # Qt's libraries, so PyInstaller can follow (and the build can run) the Qt plugins.
      - name: Install system libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 libpulse0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libwayland-cursor0 libwayland-egl1 ffmpeg libarchive-tools binutils
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch OCR language data (English) and the subtitle font (both bundled)
        run: |
          python scripts/fetch_tessdata.py
          python scripts/fetch_font.py

      # On Linux the spec bundles every editor (no add-on downloads) and writes the
      # editors_bundled marker; FFmpeg comes from the distribution (a Depends of the .deb).
      - name: Build the app
        run: pyinstaller --noconfirm packaging/umc.spec

      - name: Self-test the built app
        run: |
          dist/UniversalEdit/UniversalEdit --self-test selftest.txt || { cat selftest.txt; exit 1; }
          grep -E "^(FAIL|RESULT)" selftest.txt

      - name: Build the .deb
        run: python scripts/build_deb.py

      - uses: actions/upload-artifact@v4
        with:
          name: UniversalEdit-linux-deb
          path: dist/*.deb

  # A user's install: apt resolves the Depends on a clean system, the app passes its self-test,
  # the menu entry and Open with files are in place, and removing it leaves nothing behind.
  install-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UniversalEdit-linux-deb

      - name: Install the package (and bsdtar for the self-test's RAR check)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ./universal-edit_*.deb libarchive-tools desktop-file-utils

      - name: Check the desktop integration
        run: |
          test -x /usr/bin/universal-edit
          desktop-file-validate /usr/share/applications/universal-edit.desktop
          desktop-file-validate /usr/share/applications/universal-edit_convert.desktop
          update-desktop-database /usr/share/applications  # installed in the same apt run
          # the viewer is listed first (a double-click with no default set opens the first)
          grep -q "^application/pdf=universal-edit.desktop;universal-edit_convert.desktop;" \
            /usr/share/applications/mimeinfo.cache
          grep -q "^model/obj=universal-edit.desktop;" /usr/share/applications/mimeinfo.cache
          test -f /usr/share/icons/hicolor/256x256/apps/universal-edit.png

      - name: Self-test the installed app
        run: |
          cd /tmp
          universal-edit --self-test selftest.txt || { cat selftest.txt; exit 1; }
          grep -E "^(FAIL|RESULT)" selftest.txt

      - name: Remove it again
        run: |
          apt-get remove -y universal-edit
          test ! -e /opt/universal-edit && test ! -e /usr/bin/universal-edit
          test ! -e /usr/share/applications/universal-edit.desktop

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, install-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # one release at a time updates the apt repository (an older one must never land last)
    concurrency:
      group: apt-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: UniversalEdit-linux-deb
          path: dist

      - name: Add the .deb to the release (the Windows build adds its files to the same one)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: dist/universal-edit_*.deb

      # The signed flat apt repository (scripts/build_apt_repo.py) lives in its own release,
      # "apt" (a pre-release, so it's never "latest"), updated only here, after the install
      # tests passed: apt users never see a half-published version. Needs the APT_SIGNING_KEY
      # secret (an armored private gpg key without a passphrase); without it the apt release
      # simply stays at the previous version.
      - name: Update the apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::warning::APT_SIGNING_KEY isn't set: the apt repository wasn't updated (the .deb is in the release)."
            exit 0
          fi
          new=$(cd dist && ls universal-edit_*.deb)
          [ "$(echo "$new" | wc -l)" -eq 1 ] || { echo "expected exactly one .deb: $new"; exit 1; }
          version=$(dpkg-deb -f "dist/$new" Version)
          gh release view apt >/dev/null 2>&1 || gh release create apt --prerelease --latest=false \
            --title "apt repository" --notes "The Debian / Ubuntu package source (see the README). Updated by every release."
          # never replace a newer version (an older tag published late, or a re-run)
          current=$(gh release view apt --json assets -q '.assets[].name' \
            | sed -n 's/^universal-edit_\(.*\)_amd64\.deb$/\1/p' | head -n 1)
          if [ -n "$current" ] && dpkg --compare-versions "$current" gt "$version"; then
            echo "::warning::The apt repository already has $current (newer than $version): left as it is."
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          echo "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          python3 scripts/build_apt_repo.py "dist/$new" --out dist/apt --key "$key"
          # the package first, then the index that points at it, the signed Release last
          gh release upload apt "dist/$new" --clobber
          gh release upload apt dist/apt/Packages dist/apt/Packages.gz dist/apt/universal-edit-archive-keyring.gpg --clobber
          gh release upload apt dist/apt/Release dist/apt/Release.gpg dist/apt/InRelease --clobber
          # older packages the index no longer lists
          for asset in $(gh release view apt --json assets -q '.assets[].name'); do
            case "$asset" in
              universal-edit_*.deb) [ "$asset" = "$new" ] || gh release delete-asset apt "$asset" -y ;;
            esac
          done
