name: Build Linux package

# The Debian / Ubuntu .deb (scripts/build_deb.py), made from the same code and the same v* tag
# as the Windows build: a version tag publishes it in the same GitHub release.
# Built on Ubuntu 22.04 so it runs on every distribution with glibc 2.35 or newer
# (Debian 12+, Ubuntu 22.04+), then installed and self-tested on clean containers of each.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  QT_QPA_PLATFORM: offscreen

permissions:
  contents: write  # publishing to the release on version tags

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the app version (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'src'); import umc; print(umc.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but src/umc/__init__.py says v$v"; exit 1; }

      # Qt's libraries, so PyInstaller can follow (and the build can run) the Qt plugins.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 libpulse0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libwayland-cursor0 libwayland-egl1 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch OCR language data (English) and the subtitle font (both bundled)
        run: |
          python scripts/fetch_tessdata.py
          python scripts/fetch_font.py

      # On Linux the spec bundles every editor (no add-on downloads) and writes the
      # editors_bundled marker; FFmpeg comes from the distribution (a Depends of the .deb).
      - name: Build the app
        run: pyinstaller --noconfirm packaging/umc.spec

      - name: Self-test the built app
        run: |
          dist/UniversalEdit/UniversalEdit --self-test selftest.txt || { cat selftest.txt; exit 1; }
          grep -E "^(FAIL|RESULT)" selftest.txt

      - name: Build the .deb
        run: python scripts/build_deb.py

      - uses: actions/upload-artifact@v4
        with:
          name: UniversalEdit-linux-deb
          path: dist/*.deb

  # A user's install: apt resolves the Depends on a clean system, the app passes its self-test,
  # the menu entry and Open with files are in place, and removing it leaves nothing behind.
  install-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UniversalEdit-linux-deb

      - name: Install the package (and bsdtar for the self-test's RAR check)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ./universal-edit_*.deb libarchive-tools desktop-file-utils

      - name: Check the desktop integration
        run: |
          test -x /usr/bin/universal-edit
          desktop-file-validate /usr/share/applications/universal-edit.desktop
          desktop-file-validate /usr/share/applications/universal-edit-convert.desktop
          update-desktop-database /usr/share/applications  # installed in the same apt run
          grep -q "application/pdf=.*universal-edit.desktop" /usr/share/applications/mimeinfo.cache
          test -f /usr/share/icons/hicolor/256x256/apps/universal-edit.png

      - name: Self-test the installed app
        run: |
          cd /tmp
          universal-edit --self-test selftest.txt || { cat selftest.txt; exit 1; }
          grep -E "^(FAIL|RESULT)" selftest.txt

      - name: Remove it again
        run: |
          apt-get remove -y universal-edit
          test ! -e /opt/universal-edit && test ! -e /usr/bin/universal-edit
          test ! -e /usr/share/applications/universal-edit.desktop

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, install-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UniversalEdit-linux-deb

      - name: Add the .deb to the release (the Windows build adds its files to the same one)
        uses: softprops/action-gh-release@v2
        with:
          files: universal-edit_*.deb
