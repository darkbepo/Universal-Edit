name: Desktop tests on Linux

# Keeps the desktop app working on Linux (Debian / Ubuntu): every push that touches the
# desktop code runs the whole pytest suite on ubuntu-latest. External programs come from apt,
# the way a Debian user gets them (FFmpeg, Pandoc, LibreOffice, Ghostscript, bsdtar).

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/test-linux.yml"

env:
  QT_QPA_PLATFORM: offscreen

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt needs these system libraries (a bare Debian / Ubuntu lacks libEGL etc.);
      # the rest are the external programs the converters call.
      - name: Install system libraries and programs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0 \
            ffmpeg pandoc libreoffice-writer libreoffice-calc libreoffice-impress \
            ghostscript libarchive-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch OCR language data (English) and the subtitle font
        run: |
          python scripts/fetch_tessdata.py
          python scripts/fetch_font.py

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Run tests
        run: pytest -q

  # The oldest system the .deb supports (Debian 12: FFmpeg 5.1, glibc 2.36): ubuntu-latest has
  # the newest FFmpeg, so options older ones lack (or spell differently) only show up here.
  test-oldest:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries and programs
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0 \
            ffmpeg pandoc libreoffice-writer libreoffice-calc libreoffice-impress \
            ghostscript libarchive-tools
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch OCR language data (English) and the subtitle font
        run: |
          python scripts/fetch_tessdata.py
          python scripts/fetch_font.py

      - name: Run tests
        run: pytest -q
