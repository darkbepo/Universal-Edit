<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universal Edit</title>
    <meta name="description" content="Convert and edit images, videos, documents, 3D models and more in your browser. Files never leave your device." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon.png" sizes="256x256" type="image/png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <!-- The saved light / dark choice (src/ui/theme.ts), applied before the first paint. -->
    <script>try{var t=localStorage.getItem("umc-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <!-- Must load before anything else: enables multi-threaded FFmpeg on hosts without COOP/COEP. -->
    <script src="./coi-serviceworker.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
